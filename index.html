<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>중국어 단어장 · 21일 완성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --ink:#1B1E2B; --sub:#7A8095;
  --line:#E8EAF2; --primary:#4255FF; --primary-soft:#EDEFFF;
  --green:#12B886; --green-soft:#E6F9F2; --red:#F0455E; --red-soft:#FEEDF0;
  --amber:#F59F0A; --amber-soft:#FEF5E3;
  --radius:18px; --shadow:0 1px 2px rgba(27,30,43,.04),0 8px 24px rgba(27,30,43,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 60px}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:900;font-size:19px;letter-spacing:-.3px}
.brand em{font-style:normal;color:var(--primary)}
.daychip{background:var(--primary);color:#fff;font-weight:700;font-size:13px;padding:7px 13px;border-radius:999px;box-shadow:var(--shadow)}
.back{display:flex;align-items:center;gap:6px;color:var(--sub);font-weight:700;font-size:14px;padding:6px 0}
.back:before{content:"←";font-size:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.panel h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.panel .desc{color:var(--sub);font-size:13px;margin-bottom:14px}
.dot{width:8px;height:8px;border-radius:50%}
.count{margin-left:auto;font-size:13px;font-weight:700;color:var(--sub)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:88px;padding:12px 10px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}

/* checklist */
.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:none;padding-bottom:2px}
.task .tno{flex:0 0 auto;width:26px;height:26px;border-radius:9px;background:var(--primary-soft);color:var(--primary);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.task.tdone .tno{background:var(--green-soft);color:var(--green)}
.task .tinfo{flex:1;min-width:0}
.task .tname{font-weight:700;font-size:14.5px}
.task .tsub{font-size:12px;color:var(--sub)}
.task .tbtn{flex:0 0 auto;padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;background:var(--primary);color:#fff}
.task .tbtn.soft{background:var(--primary-soft);color:var(--primary)}
.task .tcheck{flex:0 0 auto;color:var(--green);font-weight:900;font-size:14px;background:var(--green-soft);padding:7px 13px;border-radius:999px}
.task .tnone{flex:0 0 auto;color:var(--sub);font-size:12.5px;font-weight:700}

.prog{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.prog>div{height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:900}
.stat span{font-size:11px;color:var(--sub);font-weight:500}

/* pass dots */
.pdots{display:flex;gap:4px}
.pd{width:9px;height:9px;border-radius:3px;background:var(--line)}
.pd.on{background:var(--green)}

.studyhead{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:13px;font-weight:700;margin-bottom:12px;gap:8px}
.flip-scene{perspective:1200px;margin-bottom:16px}
.flip{position:relative;width:100%;height:340px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.3,1);cursor:pointer}
.flip.flipped{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:6px}
.face.bk{transform:rotateX(180deg)}
.hanzi{font-family:'Noto Serif SC',serif;font-weight:600;font-size:72px;line-height:1.15;letter-spacing:.02em;word-break:keep-all}
.hanzi.long{font-size:44px}
.pinyin{color:var(--primary);font-size:24px;font-weight:700}
.meaning{font-size:24px;font-weight:700;line-height:1.4}
.hint{position:absolute;bottom:16px;color:var(--sub);font-size:12px;font-weight:500}
.stamp{position:absolute;top:14px;right:14px;border:1.5px solid var(--red);color:var(--red);font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;opacity:.75}
.retag{position:absolute;top:14px;left:14px;background:var(--amber-soft);color:var(--amber);font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge .no{background:var(--red-soft);color:var(--red);padding:16px;border-radius:14px;font-weight:900;font-size:16px}
.judge .ok{background:var(--green-soft);color:var(--green);padding:16px;border-radius:14px;font-weight:900;font-size:16px}
.judge button:active{transform:scale(.97)}
.navrow{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.navrow .btn{padding:15px}

.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{aspect-ratio:1/1.15;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;padding:6px;font-size:13px;font-weight:600;text-align:center;word-break:keep-all;transition:all .15s;box-shadow:var(--shadow)}
.tile.hz{font-family:'Noto Serif SC',serif;font-size:21px}
.tile.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.85)}
.tile.bad{animation:shake .3s;border-color:var(--red);background:var(--red-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.tools{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:14px;background:var(--surface)}
.search:focus{outline:2px solid var(--primary)}
select.search{flex:0 0 auto;width:auto}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-bottom:7px}
.row .rh{font-family:'Noto Serif SC',serif;font-size:21px;font-weight:600;min-width:74px}
.row .rp{color:var(--primary);font-size:12.5px;font-weight:700}
.row .rk{font-size:13px}
.row .info{flex:1;min-width:0}
.know{flex:0 0 auto;font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.know.on{background:var(--green-soft);color:var(--green);border-color:transparent}
.del{flex:0 0 auto;color:var(--red);font-size:12px;font-weight:700;padding:7px 4px}
.custombadge{font-size:10px;font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.wcbadge{flex:0 0 auto;background:var(--red-soft);color:var(--red);font-size:12px;font-weight:900;padding:5px 10px;border-radius:999px}
.duetag{font-size:11px;color:var(--amber);font-weight:700}
.row.dim{opacity:.45}
.daylabel{font-size:12px;font-weight:700;color:var(--sub);margin:16px 0 8px;letter-spacing:.4px}

.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:5px}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;background:var(--surface)}
.field input:focus{outline:2px solid var(--primary)}

.result{text-align:center;padding:40px 20px}
.result .big{font-size:42px;font-weight:900;color:var(--primary)}
.result p{color:var(--sub);margin:8px 0 22px;font-size:14px}

.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.setrow:last-child{border:none}
input[type=date]{font-family:inherit;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--surface);font-size:14px}
.linkbtn{color:var(--red);font-weight:700;font-size:13px}
.plantable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.plantable td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.plantable td:first-child{font-weight:900;color:var(--primary);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.flip{transition:none}.tile.bad{animation:none}}
</style>
</head>

  <div class="top">

    <button class="daychip" id="daychip" onclick="go('settings')">Day 1</button>
  </div>
  <div id="app"></div>
</div>

  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};

/* ---------- date helpers ---------- */
function todayISO(){
  const t = new Date();
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
}
function addDays(iso, k){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + k);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function curDay(){
  if(!start) return 1;
  const d = Math.floor((new Date(todayISO()+"T00:00:00") - new Date(start+"T00:00:00")) / 864e5) + 1;
  return Math.max(1, Math.min(TOTAL_DAYS, d));
}
function lastDayISO(){ return start ? addDays(start, TOTAL_DAYS - 1) : null; }
function clipDue(iso){
  const last = lastDayISO();
  return (last && iso > last) ? last : iso;
}
function dueLabel(iso){
  const t = todayISO();
  if(iso <= t) return "오늘";
  const diff = Math.round((new Date(iso+"T00:00:00") - new Date(t+"T00:00:00")) / 864e5);
  return diff === 1 ? "내일" : diff + "일 뒤";
}

/* ---------- pools ---------- */
function dayWords(d){ return DATA.filter(w => w.d === d); }
function dayPool(d){ return dayWords(d).filter(w => !known.has(w.n)); }
function duePool(){
  const t = todayISO();
  return DATA.filter(w => !known.has(w.n) && srs[w.n] && srs[w.n].d <= t);
}
function allUnknown(){ return DATA.filter(w => !known.has(w.n)); }
function topWrong(limit){
  return DATA.filter(w => (wc[w.n]||0) >= 1 && !known.has(w.n))
    .sort((a,b) => (wc[b.n]||0) - (wc[a.n]||0) || a.n - b.n)
    .slice(0, limit || 9999);
}
function masteredCount(){
  return allUnknown().filter(w => (pass[w.n]||0) === 3 && !srs[w.n]).length;
}

/* ---------- SRS 처리 ---------- */
function markWrong(n){
  wc[n] = (wc[n]||0) + 1;
  srs[n] = { s: 0, d: clipDue(addDays(todayISO(), INTERVALS[0])) };  // 틀리면 처음(1일)부터
  saveObj("ck_wc", wc); saveObj("ck_srs", srs);
}
function srsAdvance(n){
  const e = srs[n];
  if(!e) return;
  const next = e.s + 1;
  if(next >= INTERVALS.length){ delete srs[n]; }                      // 1·7·16일 모두 통과 → 졸업
  else { srs[n] = { s: next, d: clipDue(addDays(todayISO(), INTERVALS[next])) }; }
  saveObj("ck_srs", srs);
}

  }

  app.innerHTML = `
  ${planPanel}
  <div class="panel">
    <h2><span class="dot" style="background:var(--red)"></span>자주 틀리는 단어<span class="count">누적 ${topWrong().length}개</span></h2>
    <p class="desc">누적 오답 횟수가 많은 순서. 시험에서 틀릴 때마다 +1 됩니다.</p>
    ${tw.length ? tw.map(w => `
      <div class="task" style="padding:9px 0">
        <span class="rh" style="font-family:'Noto Serif SC',serif;font-size:20px;min-width:64px">${esc(w.h)}</span>
        <div class="tinfo"><div class="tsub" style="font-size:12.5px"><span style="color:var(--primary);font-weight:700">${esc(w.p)}</span> · ${esc(w.k)}</div></div>
        <span class="wcbadge">×${wc[w.n]}</span>
      </div>`).join("") + `
    <div class="btnrow" style="margin-top:12px">
      <button class="btn btn-soft" onclick="startTest(topWrong(),0,'최다 오답 집중 시험',{})">집중 시험</button>
      <button class="btn btn-ghost" onclick="go('wrongtop')">전체 보기</button>
    </div>` : `<p class="desc" style="margin:0;color:var(--green)">아직 없습니다. 시험을 보면 여기에 쌓입니다.</p>`}
  </div>
  <div class="panel">
    <h2>완전 암기 진행률<span class="count">${mastered} / ${au.length}</span></h2>
    <div class="prog"><div style="width:${pct}%"></div></div>
    <p class="desc" style="margin:0">시험①·② 통과 + 오답 주기 졸업까지 마친 단어 ${pct}%</p>
    <div class="stats">
      <div class="stat"><b>${DATA.length}</b><span>전체</span></div>
      <div class="stat"><b>${known.size}</b><span>아는 단어</span></div>
      <div class="stat"><b>${mastered}</b><span>완전 암기</span></div>
      <div class="stat"><b>${Object.keys(srs).filter(n=>!known.has(+n)).length}</b><span>오답 진행중</span></div>
    </div>
  </div>
  <div class="btnrow">
    <button class="btn btn-ghost" onclick="go('words')">전체 단어 · 선별</button>
    <button class="btn btn-ghost" onclick="go('addword')">+ 단어 추가</button>
  </div>`;
}

/* ----- 카드 훑기 (학습용, 채점 없음) ----- */
let bq = [], bi = 0, bflip = false, bMarkDay = null;
function startBrowse(pool, isDaily){
  if(!pool.length) return;
  bq = pool; bi = 0; bflip = false;
  bMarkDay = isDaily ? String(curDay()) : null;
  go("browse");
}
function renderBrowse(){
  const w = bq[bi];
  app.innerHTML = `
  <button class="back" onclick="go('home')">홈</button>
  <div class="studyhead"><span>카드 훑기</span><span>${bi+1} / ${bq.length}</span></div>
  <div class="flip-scene"><div class="flip ${bflip?"flipped":""}" onclick="bflip=!bflip;render()">
    <div class="face">
      <div class="stamp">Day ${w.d}</div>
      <div class="hanzi ${w.h.length>3?"long":""}">${esc(w.h)}</div>
      <div class="hint">탭해서 뒤집기</div>
    </div>
    <div class="face bk">
      <div class="pinyin">${esc(w.p)}</div>
      <div class="meaning">${esc(w.k)}</div>
      <div class="hint">탭해서 앞면</div>
    </div>
  </div></div>
  <div class="navrow">
    <button class="btn btn-ghost" onclick="if(bi>0){bi--;bflip=false;render()}">이전</button>
    <button class="btn btn-primary" onclick="browseNext()">${bi===bq.length-1?"끝내기":"다음"}</button>
  </div>`;
}
function browseNext(){
  if(bi === bq.length - 1){
    if(bMarkDay){ cdone.add(bMarkDay); saveSet("ck_card", cdone); }
    go("result", { msg: "카드 훑기 완료!", sub: "이제 시험①부터 시작하세요." });
  } else { bi++; bflip = false; render(); }
}

/* ----- 시험 (플래시카드 셀프 채점) -----
   dir 1: 한자 앞 → 뜻·병음 뒤 / dir 2: 뜻 앞 → 한자·병음 뒤 / dir 0: 카드마다 무작위 */
let tq = [], ti = 0, tflip = false, tOpts = {}, tFirstTotal = 0, tFirstCorrect = 0;
function startTest(pool, dir, title, opts){
  if(!pool.length){ alert("시험 볼 단어가 없습니다."); return; }
  tq = shuffle(pool).map(w => ({ w, dir: dir === 0 ? (Math.random() < .5 ? 1 : 2) : dir, first: true }));
  ti = 0; tflip = false; tOpts = opts || {};
  tFirstTotal = tq.length; tFirstCorrect = 0;
  go("test", { title });
}
function renderTest(){
  if(ti >= tq.length){
    if(tOpts.mark){
      (tOpts.mark === "t1" ? t1done : t2done).add(String(curDay()));
      saveSet("ck_t1", t1done); saveSet("ck_t2", t2done);
    }
    go("result", {
      msg: tFirstCorrect + " / " + tFirstTotal,
      sub: ctx.title + " · 틀린 단어는 1일 → 7일 → 16일 주기로 오답 시험에 다시 나옵니다."
    });
    return;
  }
  const item = tq[ti], w = item.w;
  const front = item.dir === 1
    ? `<div class="hanzi ${w.h.length>3?"long":""}">${esc(w.h)}</div>`
    : `<div class="meaning" style="font-size:28px">${esc(w.k)}</div>`;
  const back = item.dir === 1
    ? `<div class="pinyin">${esc(w.p)}</div><div class="meaning">${esc(w.k)}</div>`
    : `<div class="hanzi ${w.h.length>3?"long":""}" style="font-size:58px">${esc(w.h)}</div><div class="pinyin" style="font-size:20px">${esc(w.p)}</div>`;
  const srsTag = tOpts.srs && srs[w.n] ? `<div class="retag">오답 ${srs[w.n].s+1}차 검토</div>` : (!item.first ? `<div class="retag">다시 확인</div>` : "");
  app.innerHTML = `
  <button class="back" onclick="go('home')">홈</button>
  <div class="studyhead">
    <span>${esc(ctx.title)} (${item.dir===1?"한자→뜻·병음":"뜻→한자·병음"})</span>
    <span>${ti+1} / ${tq.length}</span>
  </div>
  <div class="flip-scene"><div class="flip ${tflip?"flipped":""}" onclick="tflip=!tflip;render()">
    <div class="face">
      ${srsTag}
      <div class="stamp">Day ${w.d}</div>
      ${front}
      <div class="hint">${item.dir===1?"뜻과 병음을 떠올린 뒤":"한자를 종이에 써 본 뒤"} 탭해서 확인</div>
    </div>
    <div class="face bk">
      ${back}
      <div class="hint">탭해서 앞면</div>
    </div>
  </div></div>
  ${tflip ? `
  <div class="judge">
    <button class="no" onclick="tjudge(false)">틀렸어요</button>
    <button class="ok" onclick="tjudge(true)">맞혔어요</button>
  </div>` : `
  <div class="navrow" style="grid-template-columns:1fr">
    <button class="btn btn-primary" style="padding:16px" onclick="tflip=true;render()">정답 확인</button>
  </div>`}`;
}
function tjudge(ok){
  const item = tq[ti], n = item.w.n;
  if(item.first){
    if(ok){
      tFirstCorrect++;
      if(tOpts.srs && srs[n]) srsAdvance(n);                      // 오답 시험 통과 → 다음 간격으로
      if(tOpts.mark) { pass[n] = (pass[n]||0) | (tOpts.mark === "t1" ? 1 : 2); saveObj("ck_pass", pass); }
      if(!tOpts.srs && !tOpts.mark){                              // 총복습/집중 시험도 통과 기록
        pass[n] = (pass[n]||0) | (item.dir === 1 ? 1 : 2); saveObj("ck_pass", pass);
      }
    } else {
      markWrong(n);                                               // 틀리면 1일부터 다시
      tq.push({ w: item.w, dir: item.dir, first: false });        // 세션 안에서 맞힐 때까지 반복
    }
  } else {
    if(!ok) tq.push({ w: item.w, dir: item.dir, first: false });
  }
  ti++; tflip = false; render();
}

/* ----- matching ----- */
let tiles = [], sel = null, remain = 0;
function startMatch(pool){
  if(pool.length < 4){ alert("매칭에는 단어가 4개 이상 필요합니다."); return; }
  const pairs = shuffle(pool).slice(0, Math.min(8, pool.length));
  tiles = shuffle([
    ...pairs.map(w => ({ id: w.n, t: w.h, hz: true })),
    ...pairs.map(w => ({ id: w.n, t: w.k, hz: false }))
  ]);
  sel = null; remain = pairs.length;
  go("match");
}
function renderMatch(){
  app.innerHTML = `
  <button class="back" onclick="go('home')">홈</button>
  <div class="studyhead"><span>매칭 게임</span><span>${remain}쌍 남음</span></div>
  <div class="mgrid">${tiles.map((t,i)=>`
    <button class="tile ${t.hz?"hz":""} ${t.gone?"gone":""} ${sel===i?"sel":""}" data-i="${i}" onclick="tapTile(${i})">${esc(t.t)}</button>
  `).join("")}</div>`;
}
function tapTile(i){
  const t = tiles[i];
  if(t.gone) return;
  if(sel === null){ sel = i; render(); return; }
  if(sel === i){ sel = null; render(); return; }
  const a = tiles[sel], b = t;
  if(a.id === b.id && a.hz !== b.hz){
    a.gone = b.gone = true; remain--; sel = null; render();
    if(remain === 0) setTimeout(()=>go("result",{msg:"매칭 완료!",sub:"전부 짝을 맞췄습니다."}), 250);
  } else {
    const si = sel; sel = null; render();
    document.querySelectorAll(`[data-i="${si}"],[data-i="${i}"]`).forEach(el=>el.classList.add("bad"));
    setTimeout(render, 320);
  }
}

/* ----- 자주 틀리는 단어 전체 ----- */
function renderWrongTop(){
  const list = topWrong();
  app.innerHTML = `
  <button class="back" onclick="go('home')">홈</button>
  <div class="panel" style="padding:14px 16px">
    <p class="desc" style="margin-bottom:0">누적 오답 횟수 순. 오답 주기가 남은 단어에는 다음 시험 예정일이 표시됩니다.</p>
  </div>
  ${list.length ? `
  <div class="btnrow" style="margin-bottom:12px">
    <button class="btn btn-soft" onclick="startTest(topWrong(),0,'최다 오답 집중 시험',{})">전체 집중 시험</button>
    <button class="btn btn-ghost" onclick="startBrowse(topWrong(),false)">카드 훑기</button>
  </div>
  ${list.map(w => `
  <div class="row">
    <div class="rh">${esc(w.h)}</div>
    <div class="info">
      <div class="rp">${esc(w.p)}</div>
      <div class="rk">${esc(w.k)}</div>
      ${srs[w.n] ? `<div class="duetag">다음 오답 시험: ${dueLabel(srs[w.n].d)} (${srs[w.n].s+1}/3차)</div>` : `<div class="duetag" style="color:var(--green)">오답 주기 졸업</div>`}
    </div>
    <span class="wcbadge">×${wc[w.n]}</span>
  </div>`).join("")}` : `<p class="desc" style="text-align:center;margin-top:30px">아직 틀린 단어가 없습니다.</p>`}`;
}

/* ----- word list & triage ----- */
let filterDay = 0, query = "";
function renderWords(){
  const rows = DATA.filter(w =>
    (filterDay === 0 || w.d === filterDay) &&
    (!query || w.h.includes(query) || w.k.includes(query) || w.p.toLowerCase().includes(query.toLowerCase()))
  );
  let html = `
  <button class="back" onclick="go('home')">홈</button>
  <div class="panel" style="padding:14px 16px">
    <p class="desc" style="margin-bottom:0">아는 단어는 '알아요'로 빼 두세요. 초록 칸 2개는 시험①·② 통과 표시입니다.</p>
  </div>
  <div class="tools">
    <input class="search" placeholder="한자, 병음, 뜻 검색" value="${esc(query)}" oninput="query=this.value;render()">
    <select class="search" onchange="filterDay=+this.value;render()">
      <option value="0">전체</option>
      ${Array.from({length:18},(_,i)=>`<option value="${i+1}" ${filterDay===i+1?"selected":""}>Day ${i+1}</option>`).join("")}
    </select>
  </div>
  <div class="btnrow" style="margin-bottom:12px">
    <button class="btn btn-soft" onclick="go('addword')">+ 단어 추가</button>
  </div>`;
  let lastDay = -1;
  rows.forEach(w => {
    if(w.d !== lastDay && filterDay === 0 && !query){ html += `<div class="daylabel">DAY ${w.d}</div>`; lastDay = w.d; }
    const on = known.has(w.n);
    const isCustom = w.n >= 1000;
    html += `
    <div class="row ${on?"dim":""}">
      <div class="rh">${esc(w.h)}${isCustom?'<span class="custombadge">추가</span>':""}</div>
      <div class="info">
        <div class="rp">${esc(w.p)}</div>
        <div class="rk">${esc(w.k)}</div>
        <div style="display:flex;align-items:center;gap:8px">${pdotsHTML(w.n)}
        ${wc[w.n]?`<span style="font-size:11px;color:var(--red);font-weight:700">오답 ×${wc[w.n]}</span>`:""}
        ${srs[w.n]?`<span class="duetag">${dueLabel(srs[w.n].d)} 재시험</span>`:""}</div>
      </div>
      ${isCustom?`<button class="del" onclick="delWord(${w.n})">삭제</button>`:""}
      <button class="know ${on?"on":""}" onclick="toggleKnown(${w.n})">${on?"알아요 ✓":"알아요"}</button>
    </div>`;
  });
  if(!rows.length) html += `<p class="desc" style="text-align:center;margin-top:30px">검색 결과가 없습니다.</p>`;
  app.innerHTML = html;
}
function toggleKnown(n){
  if(known.has(n)) known.delete(n);
  else { known.add(n); delete srs[n]; saveObj("ck_srs", srs); }
  saveSet("ck_known", known); render();
}
function delWord(n){
  const w = byN[n];
  if(!confirm(`'${w.h}' 단어를 삭제할까요?`)) return;
  custom = custom.filter(x => x.n !== n);
  known.delete(n); delete srs[n]; delete wc[n]; delete pass[n];
  store.set("ck_custom", JSON.stringify(custom));
  saveSet("ck_known", known); saveObj("ck_srs", srs); saveObj("ck_wc", wc); saveObj("ck_pass", pass);
  rebuild(); render();
}

/* ----- add word ----- */
function renderAdd(){
  const d = Math.min(curDay(), LEARN_DAYS);
  app.innerHTML = `
  <button class="back" onclick="go('words')">전체 단어</button>
  <div class="panel">
    <h2>단어 추가</h2>
    <p class="desc">선생님 필기에서 나온 단어를 등록하세요. 선택한 Day의 카드·시험·오답 주기에 자동 포함됩니다.</p>
    <div class="field"><label>한자</label><input id="ah" placeholder="예: 学习" autocomplete="off"></div>
    <div class="field"><label>병음 (성조 부호 포함 권장)</label><input id="ap" placeholder="예: xuéxí" autocomplete="off" autocapitalize="off"></div>
    <div class="field"><label>한국어 뜻</label><input id="ak" placeholder="예: 공부하다" autocomplete="off"></div>
    <div class="field"><label>학습 Day</label>
      <select id="ad">${Array.from({length:18},(_,i)=>`<option value="${i+1}" ${i+1===d?"selected":""}>Day ${i+1}</option>`).join("")}</select>
    </div>
    <div class="btnrow">
      <button class="btn btn-primary" onclick="addWord(false)">추가</button>
      <button class="btn btn-soft" onclick="addWord(true)">추가하고 계속</button>
    </div>
    <p class="desc" id="addmsg" style="margin:12px 0 0;color:var(--green)"></p>
  </div>`;
}
function addWord(keep){
  const h = document.getElementById("ah").value.trim();
  const p = document.getElementById("ap").value.trim();
  const k = document.getElementById("ak").value.trim();
  const d = +document.getElementById("ad").value;
  if(!h || !p || !k){ alert("한자, 병음, 뜻을 모두 입력하세요."); return; }
  if(DATA.some(w => w.h === h && w.p === p)){ alert("이미 같은 단어가 있습니다: " + h); return; }
  const n = Math.max(1000, ...custom.map(c => c.n)) + 1;
  custom.push({ n, h, p, k, d });
  store.set("ck_custom", JSON.stringify(custom));
  rebuild();
  if(keep){
    ["ah","ap","ak"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("addmsg").textContent = `'${h}' 추가됨 (Day ${d})`;
    document.getElementById("ah").focus();
  } else { go("words"); }
}

/* ----- result ----- */

/* ----- settings & plan ----- */
function renderSettings(){
  app.innerHTML = `
  <button class="back" onclick="go('home')">홈</button>
  <div class="panel">
    <h2>설정</h2>
    <div class="setrow"><span>시작일</span>

  </div>
  <div class="panel">

    <table class="plantable">
      <tr><td>매일<br>(1~18일)</td><td>① 새 단어 카드 훑기 → ② 시험① 한자→뜻·병음 → ③ 시험② 뜻→한자·병음(종이에 쓰기) → ④ 그날 예정된 오답 시험. 총 25분 안팎.</td></tr>
      <tr><td>19일</td><td>전체 시험① (한자→뜻·병음) + 오답 시험</td></tr>
      <tr><td>20일</td><td>전체 시험② (뜻→한자·병음) + 오답 시험</td></tr>
      <tr><td>21일</td><td>남은 오답 시험 + 자주 틀린 단어 집중 시험으로 마무리</td></tr>
    </table>
  </div>
  <div class="panel">
    <h2>오답 반복 주기</h2>
    <p class="desc" style="margin-bottom:0">
    시험에서 틀린 단어는 <b>1일 뒤 → 7일 뒤 → 16일 뒤</b> 오답 시험에 자동으로 다시 나오고, 세 번 모두 통과해야 졸업합니다. 도중에 또 틀리면 1일부터 다시 시작합니다.<br><br>
    이 간격은 간격 반복 연구의 원조인 SuperMemo가 보존율 실험으로 도출한 최적 반복 간격(1, 7, 16, 35일)에서 가져왔습니다. 35일 단계는 21일 플랜 범위 밖이라 제외했고, 예정일이 21일을 넘는 경우 마지막 날로 앞당겨집니다. "틀리면 처음 간격부터 다시, 그 세션 안에서는 맞힐 때까지 반복"하는 규칙도 같은 연구(SM-2)의 방식입니다.</p>
  </div>`;
}
function resetAll(){
  if(!confirm("학습 기록(아는 단어, 시험 통과, 오답, 진도)이 삭제됩니다. 추가한 단어는 유지됩니다. 계속할까요?")) return;
  ["ck_known","ck_start","ck_pass","ck_srs","ck_wc","ck_t1","ck_t2","ck_card"].forEach(k=>store.del(k));
  known = new Set(); start = null; pass = {}; srs = {}; wc = {};
  t1done = new Set(); t2done = new Set(); cdone = new Set();
  go("home");
}

render();
</script>
